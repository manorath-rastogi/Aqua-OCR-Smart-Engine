[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aqua-ocr-smart-engine"
version = "1.0.0"
description = "Aqua OCR Smart Engine: Unified, production-ready AI OCR platform by AQIVON Technologies"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Proprietary / AQIVON Technologies"}
authors = [
    {name = "AQIVON Technologies", email = "engineering@aqivon.com"}
]
dependencies = [
    "numpy>=1.24.0,<2.0.0",
    "pillow>=10.0.0",
    "opencv-python>=4.8.0",
    "pypdfium2>=5.0.0",
    "torch>=2.1.0",
    "transformers>=4.40.0,<5.0.0",
    "paddleocr>=3.0.0",
    "gradio>=4.0.0"
]

[project.scripts]
aqua-ocr = "cli:main"
omniocr = "cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["aqua_ocr_smart_engine*"]
